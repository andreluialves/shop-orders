services:
  postgres-orders:
    image: postgres:18.4
    container_name: postgres-orders
    environment:
      POSTGRES_USER: ${POSTGRES_ORDERS_USER:-shop_orders}
      POSTGRES_PASSWORD: ${POSTGRES_ORDERS_PASSWORD:-shop_orders}
      POSTGRES_DB: ${POSTGRES_ORDERS_DB:-shop_orders}
    ports:
      - "${POSTGRES_ORDERS_PORT:-5432}:5432"
    volumes:
      - postgres_orders_data:/var/lib/postgresql

  postgres-payments:
    image: postgres:18.4
    container_name: postgres-payments
    environment:
      POSTGRES_USER: ${POSTGRES_PAYMENTS_USER:-payments_service}
      POSTGRES_PASSWORD: ${POSTGRES_PAYMENTS_PASSWORD:-payments_service}
      POSTGRES_DB: ${POSTGRES_PAYMENTS_DB:-payments_service}
    ports:
      - "${POSTGRES_PAYMENTS_PORT:-5433}:5432"
    volumes:
      - postgres_payments_data:/var/lib/postgresql

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"   # porta AMQP (usada pela aplicação)
      - "15672:15672" # painel de administração web
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

volumes:
  postgres_orders_data:
  postgres_payments_data:
